# Precompressed single-file card; isolated variable names for this vhost.
map $http_accept_encoding $rozh_card_encoding {
    default "";
    "~*(^|,)\s*br\s*(;\s*q\s*=\s*(1(\.0{0,3})?|0\.[0-9]*[1-9][0-9]*))?\s*(,|$)" br;
    "~*(^|,)\s*gzip\s*(;\s*q\s*=\s*(1(\.0{0,3})?|0\.[0-9]*[1-9][0-9]*))?\s*(,|$)" gzip;
}
map $rozh_card_encoding $rozh_card_index {
    default index.html;
    br index.html.br;
    gzip index.html.gz;
}

server {
    server_name rozhdestvenskiy.ru;

    root /var/www/rozhdestvenskiy.ru;
    index index.html;

    # proxy API handles to yndxstockserver (pm2, 127.0.0.1:3000)
    location /yndx-stock-server {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = / {
        types { }
        default_type text/html;
        charset utf-8;
        gzip off;
        add_header Content-Encoding $rozh_card_encoding;
        add_header Vary Accept-Encoding;
        add_header Cache-Control "no-cache";
        try_files /$rozh_card_index =404;
    }

    location = /index.html {
        types { }
        default_type text/html;
        charset utf-8;
        gzip off;
        add_header Content-Encoding $rozh_card_encoding;
        add_header Vary Accept-Encoding;
        add_header Cache-Control "no-cache";
        try_files /$rozh_card_index =404;
    }

    # English homepage: the same precompressed card with its own head.
    location = /en/ {
        types { }
        default_type text/html;
        charset utf-8;
        gzip off;
        add_header Content-Encoding $rozh_card_encoding;
        add_header Vary Accept-Encoding;
        add_header Cache-Control "no-cache";
        try_files /en/$rozh_card_index =404;
    }

    location = /en {
        return 301 /en/;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/rozhdestvenskiy.ru.access.log;
    error_log  /var/log/nginx/rozhdestvenskiy.ru.error.log;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/rozhdestvenskiy.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/rozhdestvenskiy.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = rozhdestvenskiy.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name rozhdestvenskiy.ru;
    return 404; # managed by Certbot


}